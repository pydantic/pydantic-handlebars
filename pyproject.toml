[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'pydantic-handlebars'
version = '0.1.0'
description = 'Handlebars template engine for composing LLM prompts, built on Pydantic'
readme = 'README.md'
requires-python = '>=3.10'
license = 'MIT'
authors = [
    { name = 'Pydantic Services Inc.' },
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Libraries',
    'Topic :: Text Processing :: Markup',
    'Typing :: Typed',
]
dependencies = ['pydantic>=2.0']

[project.urls]
Homepage = 'https://github.com/pydantic/pydantic-handlebars'
Source = 'https://github.com/pydantic/pydantic-handlebars'
Issues = 'https://github.com/pydantic/pydantic-handlebars/issues'

[dependency-groups]
dev = [
    'pytest',
    'pytest-xdist',
    'pytest-examples',
    'coverage',
    'inline-snapshot',
    'dirty-equals',
    'hypothesis',
    'pydantic>=2.0',
]
lint = [
    'ruff>=0.14',
    'pyright>=1.1.408',
]
docs = [
    'mkdocs-material',
    'mkdocstrings-python',
]

[tool.hatch.build.targets.wheel]
packages = ['src/pydantic_handlebars']

[tool.ruff]
line-length = 120
target-version = 'py310'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'UP', 'I', 'D', 'TID251']

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = ['D']
'docs/**/*.py' = ['D']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
quote-style = 'single'

[tool.pyright]
pythonVersion = '3.10'
typeCheckingMode = 'strict'

[tool.pytest.ini_options]
xfail_strict = true
filterwarnings = ['error']

[tool.coverage.run]
branch = true
source = ['pydantic_handlebars', 'tests']
omit = ['tests/test_fuzz.py']

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    'pragma: no cover',
    'assert_never',
    'if TYPE_CHECKING:',
]
